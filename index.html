<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0E1116">
<title>Akü Servisi — Çok Yakında | akuservisim.com.tr</title>
<meta name="description" content="Mobil akü servisi ve yol yardım hizmetimiz çok yakında yayında.">
<!-- Site hazırlanana kadar dizine eklenmesin. Gerçek içerik yayınlandığında bu satır kaldırılacak. -->
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://akuservisim.com.tr/">
<style>
  :root{
    --bg:#0E1116;
    --bg-2:#151A21;
    --surface:#1B222B;
    --line:#28323F;
    --volt:#00E06A;
    --volt-dim:#0FA85A;
    --volt-glow:rgba(0,224,106,.35);
    --text:#EEF3F8;
    --muted:#8A97A6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:48px 20px;overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(circle at 15% 12%,rgba(0,224,106,.10),transparent 45%),
      radial-gradient(circle at 88% 85%,rgba(0,224,106,.06),transparent 42%);
  }
  .wrap{width:100%;max-width:640px;text-align:center}

  .tag{
    display:inline-flex;align-items:center;gap:9px;
    border:1px solid var(--line);background:var(--bg-2);
    padding:8px 16px;border-radius:6px;
    font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);margin-bottom:36px;
  }
  .tag .led{
    width:8px;height:8px;border-radius:50%;background:var(--volt);
    box-shadow:0 0 10px var(--volt);animation:led 1.6s ease-in-out infinite;
  }
  @keyframes led{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---- imza öğesi: şarj olan akü ---- */
  .battery{
    width:180px;height:96px;margin:0 auto 40px;position:relative;
    border:3px solid var(--line);border-radius:12px;background:var(--bg-2);
    display:flex;align-items:center;gap:6px;padding:11px;
  }
  .battery::after{
    content:"";position:absolute;right:-14px;top:50%;transform:translateY(-50%);
    width:11px;height:34px;background:var(--line);border-radius:0 4px 4px 0;
  }
  .cell{
    flex:1;height:100%;border-radius:4px;background:#222B36;
    animation:charge 2.4s ease-in-out infinite;
  }
  .cell:nth-child(1){animation-delay:0s}
  .cell:nth-child(2){animation-delay:.35s}
  .cell:nth-child(3){animation-delay:.7s}
  @keyframes charge{
    0%,100%{background:#222B36;box-shadow:none}
    35%,70%{background:var(--volt);box-shadow:0 0 18px var(--volt-glow)}
  }
  .bolt{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    pointer-events:none;
  }
  .bolt svg{width:40px;height:40px;color:var(--bg);opacity:.92}

  h1{
    font-size:clamp(1.9rem,6vw,2.9rem);font-weight:800;
    letter-spacing:-.03em;line-height:1.1;margin-bottom:16px;
  }
  h1 .accent{color:var(--volt)}
  p.lead{color:var(--muted);font-size:1.05rem;max-width:440px;margin:0 auto 40px}

  .domain{
    display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;letter-spacing:.06em;color:var(--volt);
    border:1px dashed rgba(0,224,106,.4);background:rgba(0,224,106,.06);
    padding:10px 18px;border-radius:6px;
  }

  .bar{
    height:3px;width:100%;max-width:280px;margin:44px auto 0;
    background:var(--line);border-radius:99px;overflow:hidden;position:relative;
  }
  .bar span{
    position:absolute;inset:0;width:40%;border-radius:99px;
    background:linear-gradient(90deg,transparent,var(--volt),transparent);
    animation:sweep 2.2s ease-in-out infinite;
  }
  @keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

  @media (prefers-reduced-motion:reduce){
    .cell,.led,.bar span{animation:none}
    .cell{background:var(--volt)}
  }
  @media (max-width:480px){
    .battery{width:150px;height:82px}
    .bolt svg{width:32px;height:32px}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="tag"><span class="led"></span>Hazırlanıyor</div>

    <div class="battery" role="img" aria-label="Şarj olan akü animasyonu">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="bolt">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4.09 12.97 11 14l0 8 8.91-10.97L13 10z"/></svg>
      </div>
    </div>

    <h1>Çok <span class="accent">yakında</span> yayında</h1>
    <p class="lead">Mobil akü servisi ve yol yardım sitemiz hazırlanıyor.</p>

    <span class="domain">akuservisim.com.tr</span>

    <div class="bar"><span></span></div>
  </main>
</body>
</html>
